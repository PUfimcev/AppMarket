map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Laravel public assets (Filament, Livewire vendor, Vite build) — not Next.js
    location ~ ^/(css|js|fonts|vendor|build)(/|$) {
        root /var/www/public;
        try_files $uri =404;
        access_log off;
    }

    location ~ ^/(api|docs|_scramble|sanctum|admin|livewire(-[a-f0-9]+)?|filament)(/|$) {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
