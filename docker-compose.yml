services:

  nginx:
    image: nginx:1.28.3-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - appmarket

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    env_file:
      - frontend/.env.local
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - appmarket

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - backend/.env
    healthcheck:
      test: [ "CMD-SHELL", "[ \"$$(cat /proc/1/comm)\" = php-fpm ]" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - appmarket

  postgres:
    image: postgres:18.6-bookworm
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      # PostgreSQL 18+ images expect a single mount at /var/lib/postgresql (not .../data)
      - postgres_data:/var/lib/postgresql
    networks:
      - appmarket

  redis:
    image: redis:8.8
    container_name: redis
    command:
      - redis-server
      - --appendonly
      - "yes"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - appmarket

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - appmarket

  meilisearch:
    image: getmeili/meilisearch:v1.29.0
    container_name: meilisearch
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appmarket

  worker:
    build:
      context: backend
      dockerfile: Dockerfile
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=120
      - --max-jobs=1000
    restart: unless-stopped
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - appmarket

  scheduler:
    build:
      context: backend
      dockerfile: Dockerfile
    command:
      - php
      - artisan
      - schedule:work
    restart: unless-stopped
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appmarket

volumes:
  redis_data:
  rabbitmq_data:
  postgres_data:
  meilisearch_data:

networks:
  appmarket:
    driver: bridge
